<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Once Human 繁殖管理</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff;min-height:100vh;background:#111;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;background:linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.7)),url("background.png") center/cover no-repeat;z-index:-2}
body:after{content:"";position:fixed;inset:0;backdrop-filter:blur(1px);z-index:-1}
.app{max-width:520px;margin:0 auto;padding:24px 14px 80px}
h1{text-align:center;font-size:28px;margin:18px 0 8px;text-shadow:0 3px 10px #000}
.sub{text-align:center;color:#ddd;margin-bottom:18px}
.card{background:rgba(0,0,0,.62);border:1px solid rgba(255,255,255,.2);border-radius:18px;padding:16px;margin:14px 0;box-shadow:0 8px 30px rgba(0,0,0,.35)}
input,button,select{font-size:16px;border-radius:12px;border:0;padding:13px}
input,select{width:100%;background:rgba(255,255,255,.95);color:#111;margin-bottom:10px}
button{font-weight:700;color:#fff;background:#d94b2b;width:100%;margin-top:6px}
button.secondary{background:#333}
button.delete{background:#777}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.timer{font-size:34px;font-weight:900;text-align:center;letter-spacing:1px;margin:12px 0}
.name{font-size:20px;font-weight:800}
.done{color:#ffd54a}
.small{font-size:13px;color:#ccc;text-align:center;line-height:1.5}
</style>
</head>
<body>
<div class="app">
<h1>Once Human 繁殖管理</h1>
<div class="sub">24時間繁殖タイマー</div>

<div class="card">
<input id="animalName" placeholder="動物名を入力 例：オオカミ">
<select id="hours">
<option value="24">24時間</option>
<option value="12">12時間</option>
<option value="6">6時間</option>
<option value="3">3時間</option>
<option value="1">1時間</option>
</select>
<button onclick="addTimer()">タイマー追加</button>
</div>

<div id="list"></div>

<div class="card small">
Safariで開いたら、共有ボタン →「ホーム画面に追加」でアプリ風に使えます。<br>
背景画像を使う場合は、GitHubに <b>background.png</b> という名前で画像を追加してください。
</div>
</div>

<script>
const KEY="oncehuman_breeding_timers_v1";
let timers=JSON.parse(localStorage.getItem(KEY)||"[]");

function save(){localStorage.setItem(KEY,JSON.stringify(timers));}

function addTimer(){
  const name=document.getElementById("animalName").value.trim();
  const h=Number(document.getElementById("hours").value);
  if(!name){alert("動物名を入力してください");return;}
  timers.push({id:Date.now(),name,end:Date.now()+h*60*60*1000,hours:h});
  document.getElementById("animalName").value="";
  save();render();
}

function delTimer(id){
  timers=timers.filter(t=>t.id!==id);
  save();render();
}

function resetTimer(id){
  timers=timers.map(t=>t.id===id?{...t,end:Date.now()+t.hours*60*60*1000}:t);
  save();render();
}

function fmt(ms){
  if(ms<=0)return"完了！";
  const s=Math.floor(ms/1000);
  const h=Math.floor(s/3600);
  const m=Math.floor((s%3600)/60);
  const sec=s%60;
  return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
}

function beep(){
  try{
    const ctx=new AudioContext();
    const o=ctx.createOscillator();
    const g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);
    o.frequency.value=880;g.gain.value=.08;
    o.start();setTimeout(()=>{o.stop();ctx.close()},500);
  }catch(e){}
}

let notified={};

function render(){
  const list=document.getElementById("list");
  list.innerHTML="";
  if(timers.length===0){
    list.innerHTML='<div class="card small">まだタイマーがありません。</div>';
    return;
  }
  timers.forEach(t=>{
    const left=t.end-Date.now();
    if(left<=0&&!notified[t.id]){notified[t.id]=true;beep();}
    const div=document.createElement("div");
    div.className="card";
    div.innerHTML=`
      <div class="name">${t.name}</div>
      <div class="timer ${left<=0?'done':''}">${fmt(left)}</div>
      <div class="row">
        <button class="secondary" onclick="resetTimer(${t.id})">再スタート</button>
        <button class="delete" onclick="delTimer(${t.id})">削除</button>
      </div>`;
    list.appendChild(div);
  });
}
setInterval(render,1000);
render();
</script>
</body>
</html>
