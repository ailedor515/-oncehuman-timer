<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Once Human 繁殖管理 V8 修正版</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f8e7b0;min-height:100vh;background:#050806}
body:before{content:"";position:fixed;inset:0;background:linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.9)),url("C6B5C7E6-C0A5-4D30-9AB6-24B33C4FDD14.png") center/cover no-repeat;z-index:-2}
body:after{content:"";position:fixed;inset:0;background:radial-gradient(circle at center,transparent 15%,rgba(0,0,0,.76) 100%);backdrop-filter:blur(2px);z-index:-1}
.app{max-width:600px;margin:0 auto;padding:30px 14px 90px}
h1{text-align:center;font-size:32px;margin:18px 0 6px;color:#ffd36b}
.sub{text-align:center;color:#f5deb0;margin-bottom:18px}
.card{background:rgba(0,0,0,.82);border:1px solid rgba(255,210,100,.6);border-radius:18px;padding:16px;margin:14px 0}
.badge{display:inline-block;padding:5px 10px;border:1px solid rgba(0,255,160,.55);color:#86ffc4;border-radius:999px;font-size:12px;margin-bottom:10px}
input,select,textarea,button{width:100%;font-size:16px;border-radius:12px;padding:12px;margin-bottom:9px}
input,select,textarea{background:rgba(0,0,0,.72);color:#ffe9b5;border:1px solid rgba(255,210,100,.65)}
textarea{min-height:58px}
button{border:1px solid rgba(255,235,150,.75);font-weight:900;color:#fff3c4;background:linear-gradient(180deg,#c99635,#7c4b10)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tabs button.active{background:linear-gradient(180deg,#1e7d55,#0b3d2b)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.preview{text-align:center;margin:10px 0 14px}
.preview img{width:120px;height:120px;object-fit:cover;border-radius:22px;border:2px solid #ffd36b}
.timer{font-size:36px;font-weight:900;text-align:center;color:#ffd36b}
.name{font-size:19px;font-weight:900;display:flex;align-items:center;gap:10px}
.name img{width:46px;height:46px;border-radius:12px;object-fit:cover}
.barWrap{height:12px;background:#151515;border-radius:999px;overflow:hidden;margin:10px 0}
.bar{height:100%;background:linear-gradient(90deg,#00ff99,#ffd36b)}
.meta,.historyItem{font-size:14px;border-top:1px solid rgba(255,210,100,.25);padding:7px 0}
.small{font-size:13px;text-align:center;color:#e8d6a8}
.delete{background:linear-gradient(180deg,#9b2f25,#4b0f0d)}
.secondary{background:linear-gradient(180deg,#1e7d55,#0b3d2b)}
.rare{display:flex;gap:10px;align-items:center;border:1px solid rgba(255,210,100,.55);border-radius:12px;padding:12px;margin-bottom:9px}
.rare input{width:auto;margin:0}
.stats,.dex{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat,.dexItem{background:rgba(0,0,0,.45);border:1px solid rgba(255,210,100,.35);border-radius:12px;padding:10px;text-align:center}
.stat img,.dexItem img{width:44px;height:44px;border-radius:12px;object-fit:cover}
.dexItem.locked{opacity:.45}
.toast{position:fixed;top:18px;left:14px;right:14px;background:#0b3d2b;border:1px solid #ffd36b;padding:14px;border-radius:16px;text-align:center;display:none;z-index:10}
</style>
</head>
<body>
<div id="toast" class="toast"></div>
<div class="app">
<h1>Once Human 繁殖管理</h1>
<div class="sub">繁殖タイマー</div>
<div class="card">
<div class="badge">TAMER SELECT</div>
<div class="tabs" id="tabs"></div>
</div>
<div class="card">
<div class="badge">TAMER NAME</div>
<input id="tamerName" placeholder="テイマー名を入力">
<select id="tamerColor">
<option value="#c99635">金色</option>
<option value="#1e7d55">緑</option>
<option value="#1d6fd1">青</option>
<option value="#9b2f25">赤</option>
<option value="#7b3fd1">紫</option>
</select>
</div>
<div class="card">
<div class="badge">BREEDING TIMER</div>
<select id="animalType">
<option value="オオカミ">オオカミ</option>
<option value="ヒョウ">ヒョウ</option>
<option value="クマ">クマ</option>
<option value="ホッキョクグマ">ホッキョクグマ</option>
<option value="イノシシ">イノシシ</option>
<option value="バッファロー">バッファロー</option>
<option value="シカ">シカ</option>
<option value="ヒツジ">ヒツジ</option>
<option value="ウサギ">ウサギ</option>
<option value="カピバラ">カピバラ</option>
<option value="キツネ">キツネ</option>
<option value="スノーフォックス">スノーフォックス</option>
<option value="フラミンゴ">フラミンゴ</option>
<option value="ワニ">ワニ</option>
<option value="ワニガメ">ワニガメ</option>
<option value="ウミガメ">ウミガメ</option>
</select>
<div class="preview">
<img id="animalPreview" src="IMG_5849.png">
<div id="animalPreviewName">オオカミ</div>
</div>
<input id="animalName" placeholder="動物の名前を入力 例：金糸雀">
<div class="row">
<select id="sex">
<option value="">性別</option>
<option>オス</option>
<option>メス</option>
</select>
<select id="rank">
<option value="">ランク</option>
<option>Sランク</option>
<option>Aランク</option>
<option>Bランク</option>
<option>Cランク</option>
</select>
</div>
<textarea id="trait" placeholder="特性"></textarea>
<select id="breedCount">
<option value="">繁殖回数</option>
<option>8回</option><option>7回</option><option>6回</option><option>5回</option>
<option>4回</option><option>3回</option><option>2回</option><option>1回</option>
</select>
<label class="rare"><input type="checkbox" id="rarePattern"><span>レア柄</span></label>
<textarea id="memo" placeholder="メモ 例：保管場所など"></textarea>
<button id="addBtn">このテイマーに追加</button>
<div class="small">各テイマー最大5匹まで登録できます。タイマーは24時間固定です。</div>
</div>
<div id="timerList"></div>
<div class="card"><div class="badge">COMPLETE HISTORY</div><div id="historyBox"></div><button class="delete" id="clearHistoryBtn">履歴を消す</button></div>
<div class="card"><div class="badge">BREEDING ENCYCLOPEDIA</div><div id="dexCount" class="small"></div><div id="dexBox" class="dex"></div></div>
<div class="card"><div class="badge">STATS</div><div id="statsBox" class="stats"></div><button class="delete" id="clearStatsBtn">繁殖回数をリセット</button></div>
<div class="card"><div class="badge">BACKUP</div><button id="exportBtn">データを書き出す</button><input type="file" id="importFile" accept="application/json"></div>
</div>
<script>
const animals=[
["オオカミ","IMG_5849.png"],["ヒョウ","IMG_5850.png"],["クマ","IMG_5851.png"],["ホッキョクグマ","IMG_5852.png"],
["イノシシ","IMG_5853.png"],["バッファロー","IMG_5854.png"],["シカ","IMG_5855.png"],["ヒツジ","IMG_5856.png"],
["ウサギ","IMG_5857.png"],["カピバラ","IMG_5858.png"],["キツネ","IMG_5859.png"],["スノーフォックス","IMG_5860.png"],
["フラミンゴ","IMG_5861.png"],["ワニ","IMG_5862.png"],["ワニガメ","IMG_5863.png"],["ウミガメ","IMG_5864.png"]
];
const KEY="oncehuman_v8_fixed_select";
const DAY=24*3600000;
let data=JSON.parse(localStorage.getItem(KEY)||"null")||{
active:0,
tamers:[
{name:"テイマー1",color:"#c99635",timers:[]},
{name:"テイマー2",color:"#1d6fd1",timers:[]},
{name:"テイマー3",color:"#9b2f25",timers:[]}
],
doneHistory:[],
stats:{},
dex:{}
};
let notified={};
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function activeTamer(){return data.tamers[data.active]}
function imageOf(type){let f=animals.find(a=>a[0]===type);return f?f[1]:"IMG_5849.png"}
function imageTag(type){return '<img src="'+imageOf(type)+'">'}
function updateAnimalPreview(){
let type=animalType.value;
animalPreview.src=imageOf(type);
animalPreviewName.textContent=type;
}
function renderTabs(){
tabs.innerHTML=data.tamers.map((t,i)=>{
return '<button class="'+(i===data.active?'active':'')+'" style="background:linear-gradient(180deg,'+t.color+',rgba(0,0,0,.65))" data-index="'+i+'">'+t.name+'<br>'+t.timers.length+'/5</button>';
}).join("");
tabs.querySelectorAll("button").forEach(btn=>{
btn.onclick=function(){
data.active=Number(this.dataset.index);
save();
render();
};
});
}
function setup(){
animalType.onchange=updateAnimalPreview;
updateAnimalPreview();
tamerName.oninput=function(){
activeTamer().name=this.value.trim()||("テイマー"+(data.active+1));
save();
renderTabs();
};
tamerColor.onchange=function(){
activeTamer().color=this.value;
save();
render();
};
addBtn.onclick=addTimer;
clearHistoryBtn.onclick=function(){data.doneHistory=[];save();render()};
clearStatsBtn.onclick=function(){data.stats={};data.dex={};save();render()};
exportBtn.onclick=exportData;
importFile.onchange=importData;
render();
}
function addTimer(){
let t=activeTamer();
if(t.timers.length>=5){alert("このテイマーは5匹までです");return}
if(!breedCount.value){alert("繁殖回数を選んでください");return}
let type=animalType.value;
t.timers.push({
id:Date.now(),
type:type,
name:animalName.value.trim()||type,
sex:sex.value||"未設定",
rank:rank.value||"ランク未設定",
trait:trait.value.trim(),
breedCount:breedCount.value,
rare:rarePattern.checked,
memo:memo.value.trim(),
end:Date.now()+DAY,
completed:false
});
animalName.value="";
trait.value="";
memo.value="";
rarePattern.checked=false;
breedCount.value="";
save();
render();
}
function deleteTimer(id){
activeTamer().timers=activeTamer().timers.filter(t=>t.id!==id);
save();render();
}
function resetTimer(id){
activeTamer().timers=activeTamer().timers.map(t=>t.id===id?{...t,end:Date.now()+DAY,completed:false}:t);
notified[id]=false;
save();render();
}
function fmt(ms){
if(ms<=0)return"完了！";
let s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;
return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(sec).padStart(2,"0");
}
function checkComplete(){
data.tamers.forEach(tm=>tm.timers.forEach(x=>{
let left=x.end-Date.now();
if(left<=0&&!x.completed){
x.completed=true;
data.doneHistory.unshift({tamer:tm.name,type:x.type,name:x.name,sex:x.sex,rank:x.rank,breedCount:x.breedCount,rare:x.rare,trait:x.trait,time:new Date().toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"})});
data.stats[x.type]=(data.stats[x.type]||0)+1;
data.dex[x.type]=true;
showToast(x.name+" の繁殖が完了しました！");
save();
}
}));
}
function showToast(text){
toast.textContent=text;
toast.style.display="block";
setTimeout(()=>toast.style.display="none",5000);
}
function render(){
renderTabs();
if(document.activeElement!==tamerName)tamerName.value=activeTamer().name;
if(document.activeElement!==tamerColor)tamerColor.value=activeTamer().color;
checkComplete();
renderTimers();
renderHistory();
renderDex();
renderStats();
}
function renderTimers(){
timerList.innerHTML="";
let t=activeTamer();
if(!t.timers.length){timerList.innerHTML='<div class="card small">このテイマーのタイマーはまだありません。</div>';return}
t.timers.forEach(x=>{
let left=x.end-Date.now();
let pct=Math.max(0,Math.min(100,(left/DAY)*100));
let d=document.createElement("div");
d.className="card";
d.innerHTML='<div class="badge">'+(left<=0?'COMPLETE':'ACTIVE')+'</div>'+
'<div class="name">'+imageTag(x.type)+' '+x.name+'</div>'+
'<div class="timer">'+fmt(left)+'</div>'+
'<div class="barWrap"><div class="bar" style="width:'+pct+'%"></div></div>'+
'<div class="meta">種類：'+x.type+' ／ 性別：'+x.sex+' ／ ランク：'+x.rank+' ／ 繁殖回数：'+x.breedCount+'</div>'+
(x.rare?'<div class="meta">レア柄：あり</div>':'')+
(x.trait?'<div class="meta">特性：'+x.trait+'</div>':'')+
(x.memo?'<div class="meta">メモ：'+x.memo+'</div>':'')+
'<div class="row"><button class="secondary" onclick="resetTimer('+x.id+')">再スタート</button><button class="delete" onclick="deleteTimer('+x.id+')">削除</button></div>';
timerList.appendChild(d);
});
}
function renderHistory(){
historyBox.innerHTML=data.doneHistory.length?data.doneHistory.map(h=>'<div class="historyItem">'+imageTag(h.type)+' '+h.tamer+'：'+h.name+'（'+h.type+'） '+h.sex+' '+h.rank+' '+h.breedCount+' '+(h.rare?'レア柄 ':'')+h.time+' 完了</div>').join(""):'<div class="small">完了履歴はまだありません。</div>';
}
function renderDex(){
let done=animals.filter(a=>data.dex[a[0]]).length;
dexCount.textContent="図鑑 "+done+"/16";
dexBox.innerHTML=animals.map(a=>'<div class="dexItem '+(data.dex[a[0]]?'':'locked')+'">'+imageTag(a[0])+'<br>'+(data.dex[a[0]]?'✅ ':'⬜ ')+a[0]+'</div>').join("");
}
function renderStats(){
let keys=Object.keys(data.stats);
statsBox.innerHTML=keys.length?keys.map(k=>'<div class="stat">'+imageTag(k)+'<br>'+k+'<br><b>'+data.stats[k]+'回</b></div>').join(""):'<div class="small">繁殖回数はまだありません。</div>';
}
function exportData(){
let blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="oncehuman-backup.json";
a.click();
}
function importData(e){
let f=e.target.files[0];
if(!f)return;
let r=new FileReader();
r.onload=function(){
try{data=JSON.parse(r.result);save();render();alert("読み込みました")}catch(e){alert("読み込み失敗")}
};
r.readAsText(f);
}
setup();
setInterval(render,1000);
</script>
</body>
</html>
