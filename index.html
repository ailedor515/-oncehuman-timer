<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Once Human 繁殖管理 V7</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f8e7b0;min-height:100vh;background:#050806}
body:before{content:"";position:fixed;inset:0;background:linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.9)),url("C6B5C7E6-C0A5-4D30-9AB6-24B33C4FDD14.png") center/cover no-repeat;z-index:-2}
body:after{content:"";position:fixed;inset:0;background:radial-gradient(circle at center,transparent 15%,rgba(0,0,0,.76) 100%);backdrop-filter:blur(2px);z-index:-1}
.app{max-width:600px;margin:0 auto;padding:30px 14px 90px}
h1{text-align:center;font-size:32px;margin:18px 0 6px;color:#ffd36b;text-shadow:0 0 14px rgba(255,195,64,.9),0 4px 10px #000}
.sub{text-align:center;color:#f5deb0;margin-bottom:18px}
.card{background:linear-gradient(180deg,rgba(5,15,12,.88),rgba(0,0,0,.84));border:1px solid rgba(255,210,100,.6);border-radius:18px;padding:16px;margin:14px 0}
.badge{display:inline-block;padding:5px 10px;border:1px solid rgba(0,255,160,.55);color:#86ffc4;border-radius:999px;font-size:12px;margin-bottom:10px}
input,select,textarea,button{width:100%;font-size:16px;border-radius:12px;padding:12px;margin-bottom:9px}
input,select,textarea{background:rgba(0,0,0,.72);color:#ffe9b5;border:1px solid rgba(255,210,100,.65)}
textarea{min-height:58px}
button{border:1px solid rgba(255,235,150,.75);font-weight:900;color:#fff3c4;background:linear-gradient(180deg,#c99635,#7c4b10)}
button.secondary{background:linear-gradient(180deg,#1e7d55,#0b3d2b);color:#baffd7}
button.delete{background:linear-gradient(180deg,#9b2f25,#4b0f0d);color:#ffd1c9}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tabs button{font-size:14px;padding:10px;margin:0}
.tabs button.active{background:linear-gradient(180deg,#1e7d55,#0b3d2b);color:#baffd7}
.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.timer{font-size:36px;font-weight:900;text-align:center;margin:8px 0;color:#ffd36b}
.name{font-size:19px;font-weight:900;color:#fff0c0;display:flex;align-items:center;gap:10px}
.name img{width:46px;height:46px;border-radius:12px;object-fit:cover}
.done{color:#84ffb5}
.small{font-size:13px;color:#e8d6a8;text-align:center;line-height:1.6}
.barWrap{height:12px;background:#151515;border-radius:999px;overflow:hidden;border:1px solid rgba(255,210,100,.35);margin:10px 0}
.bar{height:100%;background:linear-gradient(90deg,#00ff99,#ffd36b)}
.percent{text-align:right;font-size:12px;color:#9effc9}
.meta,.historyItem{font-size:14px;border-top:1px solid rgba(255,210,100,.25);padding:7px 0;color:#f5deb0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:rgba(0,0,0,.45);border:1px solid rgba(255,210,100,.35);border-radius:12px;padding:10px;text-align:center}
.stat img{width:44px;height:44px;border-radius:12px;object-fit:cover}
</style>
</head>
<body>
<div class="app">
<h1>Once Human 繁殖管理</h1>
<div class="sub">繁殖タイマー</div>
<div class="card">
<div class="badge">TAMER SELECT</div>
<div class="tabs" id="tabs"></div>
</div>
<div class="card">
<div class="badge">TAMER NAME</div>
<input id="tamerName" placeholder="テイマー名を入力" oninput="updateTamerName(this.value)">
</div>
<div class="card">
<div class="badge">BREEDING TIMER</div>
<select id="animalType"></select>
<input id="animalName" placeholder="動物の名前を入力 例：白牙">
<div class="row">
<select id="sex">
<option>未設定</option>
<option>オス</option>
<option>メス</option>
</select>
<select id="generation">
<option>第1世代</option>
<option>第2世代</option>
<option>第3世代</option>
<option>第4世代</option>
<option>第5世代以上</option>
</select>
</div>
<select id="hours">
<option value="24">24時間</option>
<option value="12">12時間</option>
<option value="6">6時間</option>
<option value="3">3時間</option>
<option value="1">1時間</option>
</select>
<textarea id="memo" placeholder="メモ 例：高ランク、親候補、変異あり"></textarea>
<button onclick="addTimer()">このテイマーに追加</button>
<div class="small">各テイマー最大5匹まで登録できます。</div>
</div>
<div id="timerList"></div>
<div class="card">
<div class="badge">COMPLETE HISTORY</div>
<div id="historyBox"></div>
<button class="delete" onclick="clearHistory()">履歴を消す</button>
</div>
<div class="card">
<div class="badge">STATS</div>
<div id="statsBox" class="stats"></div>
<button class="delete" onclick="clearStats()">繁殖回数をリセット</button>
</div>
</div>
<script>
const animals=[
["オオカミ","IMG_5849.png"],
["ヒョウ","IMG_5850.png"],
["クマ","IMG_5851.png"],
["ホッキョクグマ","IMG_5852.png"],
["イノシシ","IMG_5853.png"],
["バッファロー","IMG_5854.png"],
["シカ","IMG_5855.png"],
["ヒツジ","IMG_5856.png"],
["ウサギ","IMG_5857.png"],
["カピバラ","IMG_5858.png"],
["キツネ","IMG_5859.png"],
["スノーフォックス","IMG_5860.png"],
["フラミンゴ","IMG_5861.png"],
["ワニ","IMG_5862.png"],
["ワニガメ","IMG_5863.png"],
["ウミガメ","IMG_5864.png"]
];
const KEY="oncehuman_v7_fixed_2";
let data=JSON.parse(localStorage.getItem(KEY)||"null")||{
active:0,
tamers:[
{name:"テイマー1",timers:[]},
{name:"テイマー2",timers:[]},
{name:"テイマー3",timers:[]}
],
doneHistory:[],
stats:{}
};
let notified={};
function save(){
localStorage.setItem(KEY,JSON.stringify(data));
}
function activeTamer(){
return data.tamers[data.active];
}
function imgOf(type){
let found=animals.find(a=>a[0]===type);
return found?found[1]:"IMG_5849.png";
}
function imgTag(type){
return '<img src="'+imgOf(type)+'" alt="'+type+'">';
}
function setup(){
animalType.innerHTML=animals.map(a=>'<option value="'+a[0]+'">'+a[0]+'</option>').join("");
render();
}
function renderTabs(){
tabs.innerHTML=data.tamers.map((t,i)=>{
let name=t.name||("テイマー"+(i+1));
return '<button class="'+(i===data.active?'active':'')+'" onclick="switchTamer('+i+')">'+name+'<br>'+t.timers.length+'/5</button>';
}).join("");
}
function switchTamer(i){
data.active=i;
save();
render();
}
function updateTamerName(value){
activeTamer().name=value.trim()||("テイマー"+(data.active+1));
save();
renderTabs();
}
function addTimer(){
let t=activeTamer();
if(t.timers.length>=5){
alert("このテイマーは5匹までです");
return;
}
let type=animalType.value;
let name=animalName.value.trim()||type;
let h=Number(hours.value);
t.timers.push({
id:Date.now(),
type:type,
name:name,
sex:sex.value,
gen:generation.value,
memo:memo.value,
end:Date.now()+h*3600000,
hours:h,
completed:false
});
animalName.value="";
memo.value="";
save();
render();
}
function delTimer(id){
activeTamer().timers=activeTamer().timers.filter(t=>t.id!==id);
save();
render();
}
function resetTimer(id){
activeTamer().timers=activeTamer().timers.map(t=>{
if(t.id===id){
return {...t,end:Date.now()+t.hours*3600000,completed:false};
}
return t;
});
notified[id]=false;
save();
render();
}
function clearHistory(){
data.doneHistory=[];
save();
render();
}
function clearStats(){
data.stats={};
save();
render();
}
function fmt(ms){
if(ms<=0)return"完了！";
let s=Math.floor(ms/1000);
let h=Math.floor(s/3600);
let m=Math.floor((s%3600)/60);
let sec=s%60;
return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(sec).padStart(2,"0");
}
function nowText(){
let d=new Date();
return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
}
function beep(){
try{
let c=new AudioContext();
let o=c.createOscillator();
let g=c.createGain();
o.connect(g);
g.connect(c.destination);
o.frequency.value=880;
g.gain.value=.09;
o.start();
setTimeout(()=>{o.stop();c.close()},700);
if(navigator.vibrate)navigator.vibrate([300,120,300]);
}catch(e){}
}
function checkComplete(){
data.tamers.forEach(tm=>{
tm.timers.forEach(x=>{
let left=x.end-Date.now();
if(left<=0&&!x.completed){
x.completed=true;
data.doneHistory.unshift({
tamer:tm.name,
type:x.type,
name:x.name,
sex:x.sex,
gen:x.gen,
time:nowText()
});
data.stats[x.type]=(data.stats[x.type]||0)+1;
if(data.doneHistory.length>30)data.doneHistory=data.doneHistory.slice(0,30);
if(!notified[x.id]){
notified[x.id]=true;
beep();
}
save();
}
});
});
}
function renderTimers(){
let t=activeTamer();
timerList.innerHTML="";
if(t.timers.length===0){
timerList.innerHTML='<div class="card small">このテイマーのタイマーはまだありません。</div>';
return;
}
t.timers.forEach(x=>{
let left=x.end-Date.now();
let total=x.hours*3600000;
let pct=Math.max(0,Math.min(100,(left/total)*100));
let d=document.createElement("div");
d.className="card";
d.innerHTML=
'<div class="badge">'+(left<=0?'COMPLETE':'ACTIVE')+'</div>'+
'<div class="name">'+imgTag(x.type)+' '+x.name+'</div>'+
'<div class="timer '+(left<=0?'done':'')+'">'+fmt(left)+'</div>'+
'<div class="barWrap"><div class="bar" style="width:'+pct+'%"></div></div>'+
'<div class="percent">残り '+Math.round(pct)+'%</div>'+
'<div class="meta">種類：'+x.type+' ／ 性別：'+x.sex+' ／ 世代：'+x.gen+'</div>'+
(x.memo?'<div class="meta">メモ：'+x.memo+'</div>':'')+
'<div class="row">'+
'<button class="secondary" onclick="resetTimer('+x.id+')">再スタート</button>'+
'<button class="delete" onclick="delTimer('+x.id+')">削除</button>'+
'</div>';
timerList.appendChild(d);
});
}
function renderHistory(){
if(data.doneHistory.length===0){
historyBox.innerHTML='<div class="small">完了履歴はまだありません。</div>';
return;
}
historyBox.innerHTML=data.doneHistory.map(h=>{
return '<div class="historyItem">'+imgTag(h.type)+' '+h.tamer+'：'+h.name+'（'+h.type+'） '+h.sex+' '+h.gen+' '+h.time+' 完了</div>';
}).join("");
}
function renderStats(){
let keys=Object.keys(data.stats);
if(keys.length===0){
statsBox.innerHTML='<div class="small">繁殖回数はまだありません。</div>';
return;
}
statsBox.innerHTML=keys.map(k=>{
return '<div class="stat">'+imgTag(k)+'<br>'+k+'<br><b>'+data.stats[k]+'回</b></div>';
}).join("");
}
function render(){
renderTabs();
if(document.activeElement!==tamerName){
tamerName.value=activeTamer().name;
}
checkComplete();
renderTimers();
renderHistory();
renderStats();
}
setup();
setInterval(render,1000);
</script>
</body>
</html>
